<!doctype html><html><head><meta charset="utf-8"><title>JAIIB Important Questions</title>
<style>
@page{size:A4;margin:16mm}
body{font-family:Segoe UI,Arial,sans-serif;color:#222;font-size:11pt;line-height:1.4}
h1{text-align:center;color:#7a1f4d;margin:0}.sub{text-align:center;color:#666;margin-bottom:18px}
h2{color:#fff;background:#7a1f4d;padding:6px 10px;border-radius:4px;page-break-before:always;font-size:14pt}
h2.first{page-break-before:auto}
.q{margin:10px 0;page-break-inside:avoid}.q b{display:block}
.o{margin-left:18px}.ok{font-weight:600;color:#0a7a3d}.ex{margin-left:18px;color:#555;font-size:10pt}
</style></head><body>
<h1>JAIIB – Important Questions</h1><div class="sub">With answers &amp; short explanations · All 4 papers</div>
<div id="r"></div>
<script src="questions.js"></script>
<script>
let h="",first=true;
for(const k in PAPERS){
  h+=`<h2 class="${first?'first':''}">${PAPERS[k]}</h2>`;first=false;
  QUESTIONS.filter(x=>x.p===k).forEach((x,i)=>{
    h+=`<div class="q"><b>Q${i+1}. ${x.q}</b>`+x.o.map((o,j)=>`<div class="o ${j===x.a?'ok':''}">${"ABCD"[j]}) ${o}${j===x.a?' ✔':''}</div>`).join("")+`<div class="ex">${x.e}</div></div>`;
  });
}
document.getElementById("r").innerHTML=h;
</script></body></html>
